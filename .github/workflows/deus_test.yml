name: Deus Digitalis - Playback smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deus-playback-test
  cancel-in-progress: false
jobs:
  playback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run one playback check
        run: python deus_test.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deus-test-report
          path: deus_test_report.json
