name: Deus Digitalis - YouTube y Facebook

on:
  workflow_dispatch:
    inputs:
      verificar_facebook:
        description: 'Solo verificar identidad del token de Facebook, sin publicar'
        type: boolean
        default: false
      recuperar_facebook_id:
        description: 'ID anterior Facebook a recuperar (vacío = normal)'
        type: string
        default: ''
      confirmar_ausencia_facebook:
        description: 'Confirmo que el video anterior NO aparece en Business Suite; acepto riesgo residual de duplicado'
        type: boolean
        default: false
      solo_guion:
        description: 'Generar o recuperar reflexion sin publicar'
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * *' # Una vez al dia, 15:00 UTC

permissions:
  contents: write

concurrency:
  group: numenexcodice-produccion
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PUBLICAR_EN_YOUTUBE: 'true'
      PUBLICAR_EN_FACEBOOK: 'true'
      NUMEN_MAX_PENDIENTES: ${{ vars.NUMEN_MAX_PENDIENTES || '20' }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v27.0' }}
      YOUTUBE_PRIVACY: public
      ALLOW_UNREVIEWED_PUBLICATION: 'true'
      NUMEN_YOUTUBE_HANDLE: ${{ vars.NUMEN_YOUTUBE_HANDLE || '@NumenExCodice' }}
      AERO_HISTORIAL: state/historial_numen.json
      AERO_OUTPUT_DIR: output/NumenExCodice
      AERO_COLA_DIR: state/pendientes_youtube
      AERO_VIDEOS_POR_EJECUCION: '1'
      AERO_IA_MODO: auto
      AERO_IA_TIMEOUT: '100'
      AERO_IMAGENES_MINIMAS: '4'
      AERO_VELOCIDAD_VOZ: '-12%'
      AERO_TONO_VOZ: '-6Hz'
      AERO_SUBTITULOS_ADELANTO: '0.28'
      AERO_MUSICA_VOLUMEN: '0.095'
      AERO_OPENROUTER_WEB_SEARCH: 'false'
      AERO_OPENROUTER_RAZONAMIENTO: none
      GEMINI_MODELO: ${{ vars.GEMINI_MODELO || 'gemini-3.8-flash' }}
      GROQ_MODELO: ${{ vars.GROQ_MODELO || 'openai/gpt-oss-120b' }}
      GROQ_MODELO_ALTERNATIVO: ${{ vars.GROQ_MODELO_ALTERNATIVO || 'openai/gpt-oss-20b' }}
      OPENROUTER_MODELO: ${{ vars.OPENROUTER_MODELO || 'openrouter/free' }}
      AERO_IA_DRY_RUN: ${{ inputs.solo_guion && 'true' || 'false' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recuperar FFmpeg precompilado
        uses: actions/cache@v4
        with:
          path: ~/.cache/numen-ffmpeg
          key: numen-ffmpeg-static-linux-x64-v1
      - name: Verificar dependencias del sistema
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for pkg in fonts-dejavu-core libcairo2 libffi-dev pkg-config; do
            if dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              echo "OK: $pkg"
            else
              missing+=("$pkg")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo timeout 180s apt-get -o Acquire::Retries=3 update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${missing[@]}"
          fi
          bin="$HOME/.cache/numen-ffmpeg/bin"
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && ffmpeg -version >/dev/null && ffprobe -version >/dev/null; then
            echo 'OK: FFmpeg del runner'
          else
            if ! "$bin/ffmpeg" -version >/dev/null 2>&1 || ! "$bin/ffprobe" -version >/dev/null 2>&1; then
              tmp=$(mktemp -d)
              trap 'rm -rf "$tmp"' EXIT
              url='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz'
              echo 'Descargando FFmpeg y FFprobe precompilados (sin APT)'
              curl --fail --location --show-error --retry 3 --retry-all-errors --connect-timeout 25 --max-time 240 --retry-max-time 480 -o "$tmp/ffmpeg.tar.xz" "$url"
              tar -xJf "$tmp/ffmpeg.tar.xz" -C "$tmp"
              src=$(find "$tmp" -type f -path '*/bin/ffmpeg' -print -quit)
              test -n "$src"
              mkdir -p "$bin"
              install -m 755 "$src" "$bin/ffmpeg"
              install -m 755 "$(dirname "$src")/ffprobe" "$bin/ffprobe"
            fi
            export PATH="$bin:$PATH"
            echo "$bin" >> "$GITHUB_PATH"
          fi
          ffmpeg -version
          ffprobe -version
          # Comprobar los codecs y filtros necesarios para render y voz.
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=s=128x72:r=25 -f lavfi -i sine=frequency=440 -t 0.3 -af aecho=0.8:0.9:37:0.08 -c:v libx264 -c:a aac -f null -
      - name: Instalar dependencias de Python
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 'Pillow>=10,<13' 'requests>=2.31,<3' 'edge-tts>=6.1,<8' 'numpy>=1.24,<3' 'CairoSVG>=2.7,<3' 'pypdf>=4,<7' 'beautifulsoup4>=4.12,<5' 'json-repair>=0.30,<1' 'google-api-python-client>=2,<3' 'google-auth>=2,<3' 'google-auth-oauthlib>=1,<2'
      - name: Pruebas locales
        run: |
          python -m py_compile numenexcodice.py
          python numenexcodice.py --self-test
      - name: Restaurar archivos pendientes de publicacion
        uses: actions/cache/restore@v4
        with:
          path: state/pendientes_youtube
          key: numenexcodice-cola-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            numenexcodice-cola-
      - name: Recuperar cache visual historica
        uses: actions/cache/restore@v4
        with:
          path: state/visuales_numen
          key: numen-visuales-v14-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            numen-visuales-v14-
      - name: Recuperar estado confirmado del repositorio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/pendientes_youtube
          # Los JSON confirmados en Git tienen prioridad sobre una cache antigua.
          if git ls-files state/pendientes_youtube | grep -q .; then
            git restore --source=HEAD --worktree -- state/pendientes_youtube
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Generar y publicar reflexion
        id: producir
        timeout-minutes: 55
        env:
          FB_RECUPERAR_ID: ${{ inputs.recuperar_facebook_id }}
          FB_CONFIRMAR_AUSENCIA: ${{ inputs.confirmar_ausencia_facebook && 'true' || 'false' }}
          SOLO_VERIFICAR_FACEBOOK: ${{ inputs.verificar_facebook && 'true' || 'false' }}
        run: |
          if [ "$SOLO_VERIFICAR_FACEBOOK" = true ]; then
            python numenexcodice.py --check-facebook
          elif [ -n "$FB_RECUPERAR_ID" ] || [ "$FB_CONFIRMAR_AUSENCIA" = true ]; then
            if [ "$AERO_IA_DRY_RUN" = true ]; then
              echo 'No combinar recuperación con solo_guion'; exit 1
            fi
            python numenexcodice.py --recover-facebook
          else
            python numenexcodice.py
          fi
      - name: Persistir memoria e historial
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          # Solo JSON de estado; nunca tokens, MP4 ni fotografias.
          if find state -type f -name '*.json' -print -quit | grep -q . || git ls-files -- ':(glob)state/**/*.json' | grep -q .; then
            git add -A -- ':(glob)state/**/*.json'
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'NumenExCodice: actualizar memoria e historial [skip ci]'
            branch='${{ github.event.repository.default_branch }}'
            # Reaplicar exclusivamente el commit de estado sobre cambios recientes.
            # Nunca usar force-push ni resolver silenciosamente conflictos de JSON.
            for intento in 1 2 3 4 5; do
              git fetch origin "$branch"
              if ! git rebase "origin/$branch"; then
                git rebase --abort
                echo '::error::Conflicto de estado. Se conserva el respaldo en los artefactos y la cache; revisar antes de republicar.'
                exit 1
              fi
              if git push origin "HEAD:refs/heads/$branch"; then
                echo 'Estado sincronizado correctamente.'
                exit 0
              fi
              sleep "$((intento * 3))"
            done
            echo '::error::No se pudo sincronizar el estado tras cinco intentos. Recuperar el respaldo antes de volver a publicar.'
            exit 1
          fi
      - name: Conservar cache visual historica
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/visuales_numen
          key: numen-visuales-v14-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Conservar cola de publicaciones
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/pendientes_youtube
          key: numenexcodice-cola-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Guardar respaldo de produccion y diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numenexcodice-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/NumenExCodice/**/*.mp4
            !output/NumenExCodice/**/clip_*.mp4
            !output/NumenExCodice/**/video_sin_*.mp4
            output/NumenExCodice/**/*.jpg
            output/NumenExCodice/**/*.srt
            output/NumenExCodice/**/*.json
            output/NumenExCodice/**/*.txt
            state/pendientes_youtube/**
            state/*.json
          retention-days: 14
          if-no-files-found: ignore
